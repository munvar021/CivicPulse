version: "3.9"

# Local development stack — MongoDB + Express API
# Client runs natively: cd client && npm start
#
# Usage:
#   make docker-up    → start stack
#   make docker-down  → stop stack
#   make docker-logs  → tail logs

services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: CivicPulse
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - server_modules:/app/node_modules
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 8080
      # Override MONGO_URI to use the docker service name
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    command: sh -c "npm install && npm run server"

volumes:
  mongo_data:
  server_modules:
